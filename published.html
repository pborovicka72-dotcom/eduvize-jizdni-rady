<!doctype html>
<html lang="cs" data-kiosk-app="transport">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Jízdní řády · Eduvize</title>
  <style>html,body{min-height:100%;margin:0;background:#eaf4f8}#stage{visibility:hidden}#loading{position:fixed;inset:0;display:grid;place-items:center;color:#15354a;font:18px system-ui,sans-serif}#loading[hidden]{display:none}</style>
  <link rel="stylesheet" href="/eduvize-styly/design-system/admin-tokens.css?v=20261119-loading-unified-r1">
  <link rel="stylesheet" href="/eduvize-styly/design-system/transport.css">
  <link rel="stylesheet" href="/eduvize-styly/design-system/app-icons.css">
  <link rel="stylesheet" href="/eduvize-styly/design-system/output-header.css?v=20261120-contrast-r1">
  <link rel="stylesheet" href="./published.css?v=20261120-transport-theme-r1">
  <script defer src="/eduvize-styly/design-system/output-client.js"></script>
  <script defer src="/eduvize-styly/design-system/segment-profile.js?v=20261119-shared-head-336-r3"></script>
  <script defer src="/eduvize-styly/design-system/nsp-geometry.js"></script>
  <script defer src="/eduvize-styly/design-system/transport-layout.js"></script>
  <script defer src="/eduvize-styly/design-system/app-icons.js"></script>
  <script defer src="/eduvize-styly/design-system/output-runtime.js?v=20261120-kiosk-context-r1"></script>
  <script defer src="./published.js?v=20261121-idsjmk-delay-r1"></script>
  <script src="/_environment.js" defer></script>
</head>
<body>
  <p id="loading" role="status">Načítám jízdní řády…</p>
  <main id="stage" class="page">
    <section class="panel" aria-label="Odjezdy">
      <header class="head edu-output-header">
        <div class="identity edu-header-group">
          <span class="edu-app-icon" data-edu-app-icon="transport" aria-hidden="true"></span>
          <div><h1 class="edu-header-title">Odjezdy</h1><div class="subtitle edu-header-meta" id="station"></div></div>
        </div>
        <div class="clock"><div class="clock-time edu-header-title" id="clock">--:--</div><div class="clock-date edu-header-meta" id="date"></div></div>
      </header>
      <div class="body">
        <div class="table-header"><span>Odjezd</span><span>Linka</span><span class="destination-heading">Směr</span><span class="stop-heading">Zastávka</span><span>Za</span><span id="delay-heading">Zpoždění</span></div>
        <div class="departures-viewport" id="viewport">
          <div id="rows"><div class="message">Načítám publikovaný výstup…</div></div>
        </div>
      </div>
      <footer class="footer">
        <span class="state"><span class="dot" id="dot"></span><span id="status" role="status">Načítám publikovaný výstup…</span></span>
        <span class="footer-caption">Plánované časy ČR · CIS JŘ · Ministerstvo dopravy / živé údaje PID · Golemio / IDS JMK · KORDIS JMK a město Brno</span>
        <nav aria-label="Stránkování"><button id="previous" type="button">Předchozí</button><span id="page"></span><button id="next" type="button">Další</button></nav>
      </footer>
    </section>
  </main>
</body>
</html>
