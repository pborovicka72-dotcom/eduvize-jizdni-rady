<body>
<header class="site-header"><div class="site-brand"><div class="site-icon" data-edu-app-icon="transport"></div><div><div class="site-eyebrow">Eduvize · Doprava</div><div class="site-heading">Jízdní řády PID</div><div class="site-subtitle">Přehled odjezdů ze zvolených zastávek</div></div></div></header>
<main class="page"><section class="panel" aria-label="Odjezdy PID">
<header class="head edu-output-header"><div class="identity edu-header-group"><span class="bus" data-edu-app-icon="transport"></span><div><h1 class="edu-header-title">Odjezdy</h1><div class="subtitle edu-header-meta" id="station">Načítání zastávek…</div></div></div><div class="clock"><div class="clock-time edu-header-title" id="clock">--:--</div><div class="clock-date edu-header-meta" id="date"></div></div></header>
<div class="body"><div class="table-header"><span>Odjezd</span><span>Linka</span><span class="destination-heading">Směr</span><span class="stop-heading">Zastávka</span><span>Za</span></div><div class="departures-viewport" id="viewport"><div id="departures" aria-live="off"><div class="message">Načítám jízdní řád…</div></div></div></div>
<footer class="footer"><span class="state"><span id="dot" class="dot"></span><span id="status">Načítání dat z API</span></span><span class="footer-caption">Plánované odjezdy · bez zpoždění</span><span id="pagination" class="pagination"></span><span id="updated" class="updated"></span><span class="version">Odjezdy · v2026.10.31.3</span></footer>
</section></main>
<script>
'use strict';
const query=new URLSearchParams(location.search);
const kioskOutput=window.EduvizeOutputModes.isKiosk();const showAll=window.EduvizeOutputModes.mode()==='web';
if(showAll)document.body.classList.add('show-all');
if(showAll){document.body.classList.add('web-mode');}
const names=(query.get('stops')||query.get('name')||'Pod Žvahovem|Hlubočepy').split('|').map(x=>x.trim()).filter(Boolean);
const stops=[...new Set(names)];
const minutes=boundedNumber(query.get('minutes'),60,1,720);
const limit=boundedNumber(query.get('limit'),25,1,200);
const pageSeconds=boundedNumber(query.get('pageSeconds'),10,3,120);
const source=query.get('source')||'pid';
const selectedTypes=new Set((query.get('types')||'bus,tram,metro,train,ferry,funicular').split(','));
function transportType(d){const type=Number(d.route_type);if(type===1)return 'metro';if(type===0||type===900)return 'tram';if(type===2||(type>=100&&type<200))return 'train';if(type===3||(type>=700&&type<800))return 'bus';if(type===4||(type>=1000&&type<1100))return 'ferry';if(type===7||(type>=1300&&type<1400))return 'funicular';return 'bus'}
const zone='Europe/Prague';
const timeFormat=new Intl.DateTimeFormat('cs-CZ',{timeZone:zone,hour:'2-digit',minute:'2-digit'});
const dateFormat=new Intl.DateTimeFormat('cs-CZ',{timeZone:zone,weekday:'long',day:'numeric',month:'long',year:'numeric'});
const $=id=>document.getElementById(id);
let allDepartures=[],pages=[[]],pageIndex=0,refreshInProgress=false,initialLoading=true,loadFailed=false;
function boundedNumber(value,fallback,min,max){if(value===null||value==='')return fallback;const n=Number(value);return Number.isFinite(n)?Math.max(min,Math.min(max,Math.floor(n))):fallback}
function stopWord(n){return n===1?'zastávka':n>=2&&n<=4?'zastávky':'zastávek'}
function tidyName(value){return String(value).replace(/,\s*/g,', ').replace(/žel\.\s*st\./gi,'žel. st.').replace(/\s+/g,' ').trim()}
function updateClock(){const now=new Date();$('clock').textContent=timeFormat.format(now);$('date').textContent=dateFormat.format(now)}
function textNode(tag,cls,value){const el=document.createElement(tag);el.className=cls;el.textContent=value;return el}
function setStatus(value,kind){$('status').textContent=value;$('dot').className='dot '+(kind||'')}
const SVG_NS='http://www.w3.org/2000/svg';
function makeIcon(kind){
  const svg=document.createElementNS(SVG_NS,'svg');
  svg.setAttribute('viewBox','0 0 24 24');svg.setAttribute('width','20');svg.setAttribute('height','20');
  svg.setAttribute('fill','none');svg.setAttribute('stroke','currentColor');svg.setAttribute('stroke-width','1.8');
  svg.setAttribute('stroke-linecap','round');svg.setAttribute('stroke-linejoin','round');
  svg.setAttribute('aria-hidden','true');svg.classList.add('route-icon');
  const paths={
    bus:'M5 17V6a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v11a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2ZM5 11h14M8 15h.01M16 15h.01M8 19v2M16 19v2',
    tram:'M5 17V7a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v10a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2ZM5 11h14M8 15h.01M16 15h.01M8 19l-2 2M16 19l2 2M9 2h6',
    train:'M5 16V6a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3ZM5 11h14M8 15h.01M16 15h.01M8 19l-2 3M16 19l2 3',
    metro:'M5 16V6a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v10a3 3 0 0 1-3 3H8a3 3 0 0 1-3-3ZM5 11h14M8 15h.01M16 15h.01M8 19l-2 3M16 19l2 3',
    ferry:'M3 17l3 3 6-2 6 2 3-3-3-7H6l-3 7ZM12 3v7M8 6h8M2 22c2-1 4-1 6 0 2-1 4-1 6 0 2-1 4-1 6 0',
    funicular:'M5 17 7 8h10l2 9-2 2H7l-2-2ZM7 13h10M8 19l-2 3M16 19l2 3M12 8V2',
    other:'M12 3v18M3 12h18'
  };
  const path=document.createElementNS(SVG_NS,'path');path.setAttribute('d',paths[kind]||paths.other);svg.append(path);
  return svg;
}
function routeBadge(d){
  const line=String(d.line||'—').trim();
  const type=Number(d.route_type);
  const badge=document.createElement('span');badge.className='route';
  let kind='other',label='spoj';
  if(type===1){kind='metro';label='metro';badge.classList.add(['A','B','C'].includes(line.toUpperCase())?'metro-'+line.toLowerCase():'unknown');}
  else if(type===0||type===900){kind='tram';label='tramvaj';badge.classList.add('tram');}
  else if(type===2||type>=100&&type<200){kind='train';label='vlak';badge.classList.add('train');}
  else if(type===3||type>=700&&type<800){kind='bus';label='autobus';}
  else if(type===4||type>=1000&&type<1100){kind='ferry';label='přívoz';badge.classList.add('ferry');}
  else if(type===7||type>=1300&&type<1400){kind='funicular';label='lanovka';badge.classList.add('funicular');}
  else{badge.classList.add('unknown');}
  badge.append(makeIcon(kind),textNode('span','route-number',line));
  badge.setAttribute('aria-label',label+' '+line);
  return badge;
}
function buildRow(d){const row=document.createElement('div');row.className='departure';const date=new Date(d.scheduled_at);row.append(textNode('span','time',timeFormat.format(date)),routeBadge(d),textNode('span','destination',tidyName(d.destination||'—')),textNode('span','stop',tidyName(d.stop_name||'—')));const countdown=textNode('span','countdown','—');countdown.dataset.departure=String(date.getTime());row.append(countdown);return row}
function updateCountdowns(){for(const el of document.querySelectorAll('[data-departure]')){const ms=Number(el.dataset.departure)-Date.now();el.textContent=ms<=0?'odjíždí':Math.ceil(ms/60000)+' min'}}
function render(){const root=$('departures');root.replaceChildren();const current=pages[pageIndex]||[];if(!current.length){const message=initialLoading?'Načítám jízdní řády…':loadFailed?'Odjezdy se nepodařilo načíst.':'V nastaveném časovém okně nejsou plánované odjezdy.';root.append(textNode('div','message',message))}else{for(const d of current)root.append(buildRow(d))}updateCountdowns();$('pagination').textContent=pages.length>1?`Strana ${pageIndex+1}/${pages.length}`:'';if(kioskOutput){transportPrevious.disabled=pageIndex===0;transportNext.disabled=pageIndex>=pages.length-1;transportNav.hidden=pages.length<2}}
const transportNav=document.createElement('nav');transportNav.className='edu-kiosk-pagination';const transportPrevious=document.createElement('button'),transportNext=document.createElement('button');transportPrevious.textContent='← Předchozí';transportNext.textContent='Další →';transportPrevious.type=transportNext.type='button';transportNav.setAttribute('aria-label','Stránkování odjezdů');transportNav.append(transportPrevious,transportNext);transportNav.hidden=true;if(kioskOutput)document.querySelector('.panel').append(transportNav);transportPrevious.onclick=()=>{pageIndex=Math.max(0,pageIndex-1);render()};transportNext.onclick=()=>{pageIndex=Math.min(pages.length-1,pageIndex+1);render()};
function repaginate(){
if(showAll){pages=[allDepartures];pageIndex=0;render();return}
const height=$('viewport').clientHeight;if(height<=0)return;
const root=$('departures');root.replaceChildren();
const measured=allDepartures.map(d=>{const row=buildRow(d);root.append(row);return {data:d,row}});
pages=[];let current=[],used=0;
for(const item of measured){
const style=getComputedStyle(item.row),size=item.row.getBoundingClientRect().height+parseFloat(style.marginBottom||0);
if(current.length&&used+size>height+0.5){pages.push(current);current=[];used=0}
current.push(item.data);used+=size;
}
if(current.length)pages.push(current);if(!pages.length)pages=[[]];
pageIndex=Math.min(pageIndex,pages.length-1);render();
}
async function load(){if(refreshInProgress)return;refreshInProgress=true;try{const staticBase=query.get('staticData')||'./data/departures.json';const url=new URL(staticBase,location.href);let data;
if(query.has('staticData')){const response=await fetch(url,{cache:'no-store'});if(!response.ok)throw new Error('HTTP '+response.status);data=await response.json()}
else {
const encoder=new TextEncoder();
const keys=await Promise.all(stops.map(async name=>{const digest=await crypto.subtle.digest('SHA-256',encoder.encode(name));return [...new Uint8Array(digest)].slice(0,1).map(v=>v.toString(16).padStart(2,'0')).join('')}));
try{const responses=await Promise.all([...new Set(keys)].map(async key=>{const res=await fetch('./data/shards/'+key+'.json',{cache:'no-store'});if(!res.ok)throw Error('Chybí data PID pro '+key+' (HTTP '+res.status+')');return res.json()}));
data={generated_at:responses[0]?.generated_at,departures:responses.flatMap(x=>x.departures)};}
catch(shardError){console.warn('Úplný export zatím není dostupný:',shardError);const fallback=await fetch('./data/departures.json',{cache:'no-store'});if(!fallback.ok)throw shardError;data=await fallback.json()}
}if(!Array.isArray(data.departures))throw new Error('Neplatná data PID');const generated=Date.parse(data.generated_at||'');const stale=!Number.isFinite(generated)||Date.now()-generated>36*3600000;const available=new Set(data.departures.map(d=>d.stop_name));const missing=stops.filter(name=>!available.has(name));const valid=[{value:data.departures.filter(d=>stops.includes(d.stop_name))}];const now=Date.now(),until=now+minutes*60000;const merged=valid.flatMap(r=>r.value).filter(d=>{const t=Date.parse(d.scheduled_at);return selectedTypes.has(transportType(d))&&Number.isFinite(t)&&t>=now&&t<=until});const seen=new Set();allDepartures=merged.filter(d=>{const key=[d.stop_id||d.stop_name,d.trip_id||'',d.line,d.destination,d.scheduled_at].join('|');if(seen.has(key))return false;seen.add(key);return true}).sort((a,b)=>Date.parse(a.scheduled_at)-Date.parse(b.scheduled_at)).slice(0,limit);pageIndex=0;initialLoading=false;loadFailed=false;repaginate();setStatus(missing.length?'V exportu chybí: '+missing.join(', '):stale?'Pozor: jízdní řády nejsou aktuálně obnovené':'Plánované odjezdy PID',missing.length||stale?'error':'ok');$('updated').textContent=Number.isFinite(generated)?'Data PID: '+new Intl.DateTimeFormat('cs-CZ',{timeZone:zone,day:'numeric',month:'numeric',hour:'2-digit',minute:'2-digit'}).format(new Date(generated)):'Čas aktualizace není dostupný';if(missing.length)console.warn('Zastávky nejsou v exportu',missing)}catch(err){initialLoading=false;loadFailed=true;setStatus('API momentálně není dostupné','error');if(!allDepartures.length)repaginate();console.error('Eduvize PID:',err)}finally{refreshInProgress=false}}
$('station').textContent=`${stops.length} ${stopWord(stops.length)} · následujících ${minutes} min`;
function applyTransportLayout(){window.EduvizeTransportLayout.apply(document.body,{web:document.body.classList.contains('web-mode')},innerWidth,innerHeight)}
applyTransportLayout();window.addEventListener('resize',applyTransportLayout);document.fonts?.ready.then(repaginate);
updateClock();load();setInterval(()=>{updateClock();updateCountdowns()},10000);setInterval(load,60000);setInterval(()=>{if(!kioskOutput&&!showAll&&pages.length>1){pageIndex=(pageIndex+1)%pages.length;render()}},pageSeconds*1000);new ResizeObserver(()=>repaginate()).observe($('viewport'));
</script>
