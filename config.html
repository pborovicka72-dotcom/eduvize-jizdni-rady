<!doctype html>
<html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Eduvize | Nastavení jízdních řádů</title><style>
*{box-sizing:border-box}body{font-family:"Open Sans",Arial,sans-serif;background:#f5f9fc;color:#172b4d;margin:0;padding:28px}.card{max-width:820px;margin:auto;background:#fff;border-radius:14px;overflow:hidden;box-shadow:0 8px 30px #1232}.head{padding:24px 28px;background:linear-gradient(90deg,#0874b8,#00a995);color:white}h1{margin:0;font-size:28px}form{padding:28px;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}label{display:block;font-weight:700;font-size:14px}input,select{display:block;width:100%;margin-top:8px;padding:10px 12px;min-height:42px;border:1px solid #c7d7e1;border-radius:8px;background:white;color:#172b4d;font:inherit}.full{grid-column:1/-1}.hint{font-size:13px;color:#526678;font-weight:400;margin-top:5px}.actions{display:flex;gap:12px;flex-wrap:wrap}button{border:0;border-radius:8px;background:#0868ad;color:white;padding:12px 18px;font-weight:700;cursor:pointer}button.secondary{background:#e6f3f5;color:#0868ad}#notice{margin-top:12px;font-size:14px}@media(max-width:600px){form{grid-template-columns:1fr;padding:18px}.head{padding:18px}}
</style></head><body><div class="card"><div class="head"><h1>Jízdní řády PID</h1><div>Konfigurace zobrazení · Eduvize</div></div><form id="form"><label class="full">Zastávky (jedna na řádek)<textarea id="stops" rows="4" style="display:block;width:100%;margin-top:8px;padding:12px;border:1px solid #c7d7e1;border-radius:8px;font:inherit">Pod Žvahovem
Hlubočepy</textarea><div class="hint">Názvy musí přesně odpovídat zastávkám obsaženým ve statickém exportu PID.</div></label><label>Typ výstupu<select id="viewMode"><option value="nsp">Newline Signage Pro</option><option value="web">Běžná stránka</option></select></label><label>Časové okno (minut)<input id="minutes" type="number" min="1" max="720" value="60"></label><label>Počet odjezdů<input id="limit" type="number" min="1" max="200" value="25"></label><label>Přepínání stránek (sekund)<input id="pageSeconds" type="number" min="3" max="120" value="10"></label><div class="full"><div class="actions"><button type="submit">Použít a otevřít výstup</button><button type="button" class="secondary" id="copy">Kopírovat odkaz</button></div><div id="notice" role="status"></div></div></form></div><script>
const $=id=>document.getElementById(id);
function outputUrl(){const url=new URL('./index.html',location.href);const stops=$('stops').value.split(/\n/).map(x=>x.trim()).filter(Boolean);if(!stops.length)throw Error('Zadejte alespoň jednu zastávku.');url.searchParams.set('stops',stops.join('|'));for(const key of ['minutes','limit','pageSeconds','viewMode'])url.searchParams.set(key,$(key).value);return url.href}
$('form').addEventListener('submit',e=>{e.preventDefault();try{window.open(outputUrl(),'_blank','noopener')}catch(err){$('notice').textContent=err.message}});
$('copy').addEventListener('click',async()=>{try{const url=outputUrl();await navigator.clipboard.writeText(url);$('notice').textContent='Odkaz zkopírován.'}catch(err){$('notice').textContent='Nepodařilo se kopírovat: '+err.message}});
</script></body></html>
