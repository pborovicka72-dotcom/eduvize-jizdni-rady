name: Test národního jízdního řádu
on:
  push:
    branches: [main]
    paths:
      - 'transport-national.js'
      - 'tests/national-reader.test.cjs'
      - 'scripts/*national*'
      - '.github/workflows/test-national.yml'
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: node --test tests/*.cjs tests/*.mjs
      - run: python -m unittest discover -s scripts -p 'test_export*.py' -v

      - run: pip install -r realtime/requirements.txt
      - run: python -m unittest discover -s realtime -p "test_*.py" -v

      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - run: node tests/e2e/source-network.cjs
