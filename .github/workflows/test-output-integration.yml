name: Transport – společný output API (připnuté zdroje)
on:
  pull_request:
  workflow_dispatch:
    inputs:
      core_sha:
        description: Schválený úplný SHA eduvize-admin
        default: "162cd485b4b1150a207a7c1c32344b990c2f9933"
        required: false
        type: string
      styles_sha:
        description: Schválený úplný SHA eduvize-styly
        default: "9c200dd0b8f8d579e275fc76ad29ec9ccf13735f"
        required: false
        type: string
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-24.04
    env:
      CORE_SHA: ${{ inputs.core_sha || '162cd485b4b1150a207a7c1c32344b990c2f9933' }}
      STYLES_SHA: ${{ inputs.styles_sha || '9c200dd0b8f8d579e275fc76ad29ec9ccf13735f' }}
    steps:
      - name: Validate immutable dependency references
        run: |
          [[ "$CORE_SHA" =~ ^[a-f0-9]{40}$ ]]
          [[ "$STYLES_SHA" =~ ^[a-f0-9]{40}$ ]]
      - uses: actions/checkout@v4
      - name: Require read-only access to private shared repositories
        env:
          SHARED_READ_TOKEN: ${{ secrets.EDUVIZE_OUTPUT_READ_TOKEN }}
        run: |
          if [[ -z "$SHARED_READ_TOKEN" ]]; then
            echo "::error::Configure EDUVIZE_OUTPUT_READ_TOKEN with read-only Contents access to eduvize-admin and eduvize-styly. The default repository token cannot read private dependencies."
            exit 1
          fi
      - uses: actions/checkout@v4
        with:
          repository: pborovicka72-dotcom/eduvize-admin
          token: ${{ secrets.EDUVIZE_OUTPUT_READ_TOKEN }}
          ref: ${{ env.CORE_SHA }}
          path: .test-dependencies/core
      - uses: actions/checkout@v4
        with:
          repository: pborovicka72-dotcom/eduvize-styly
          token: ${{ secrets.EDUVIZE_OUTPUT_READ_TOKEN }}
          ref: ${{ env.STYLES_SHA }}
          path: .test-dependencies/styles
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: pip install -r .test-dependencies/core/requirements.txt
      - name: Real registry and transport adapter tests
        env:
          PYTHONPATH: .test-dependencies/core:.
          EDUVIZE_OUTPUT_CORE: .test-dependencies/core
        run: python -m unittest discover -s tests -p test_output_adapter.py -v
      - run: npm install --no-save --package-lock=false playwright@1.58.2
      - run: npx playwright install --with-deps chromium
      - name: Published renderer and administration browser checks
        env:
          EDUVIZE_OUTPUT_STYLES: .test-dependencies/styles
        run: |
          node tests/e2e/published-output.cjs > published-browser-evidence.json
          node tests/e2e/publication-actions.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: transport-output-browser-evidence
          path: published-browser-evidence.json
