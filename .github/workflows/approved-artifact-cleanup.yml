name: One-time approved artifact cleanup
on:
  push:
    paths:
      - '.github/workflows/approved-artifact-cleanup.yml'
permissions:
  actions: write
  contents: read
jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: Delete only approved old Pages artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os, urllib.request, urllib.error
          ids = [13313010661,13295122761,13281895428,13281007708,13279383235,13268350537,13254609452]
          for artifact_id in ids:
              url = 'https://api.github.com/repos/pborovicka72-dotcom/eduvize-jizdni-rady/actions/artifacts/' + str(artifact_id)
              request = urllib.request.Request(url, method='DELETE', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json', 'X-GitHub-Api-Version': '2022-11-28'})
              try:
                  with urllib.request.urlopen(request) as response:
                      print(str(artifact_id) + ': deleted (' + str(response.status) + ')')
              except urllib.error.HTTPError as error:
                  if error.code != 404:
                      raise
                  print(str(artifact_id) + ': already absent')
          PY
