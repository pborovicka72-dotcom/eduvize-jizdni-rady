services:
  - type: web
    name: eduvize-pid-realtime
    runtime: python
    plan: free
    rootDir: realtime
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn realtime:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: GOLEMIO_API_KEY
        sync: false
